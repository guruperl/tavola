<!DOCTYPE html>
<html lang="en">
<head>
<script>
function read_pfm(s) {
	var gh = ["&#65296;","&#65297;","&#65298;","&#65299;","&#65300;","&#65301;","&#65302;","&#65303;","&#65304;","&#65305;"];
	var y = [];
	for (c of s) y.push(gh[parseInt(c)]);
	return y.join("");
}
	
function pfm(s) {
	var k = unescape("%0D%0A");
	var un = "";
	var l = s.length;
	var oh= Math.round(l/2);
	for(var i=0; i<=oh; i++) un += s.charAt(i)+s.charAt(i+oh);
	return un.substr(0,l).replace(/`/g,"'").replace(/@@/g,"\\\\").replace(/qg/g,k);
}
var x = (100000+Math.floor(Math.random() * 900000)) + '';
</script>
</head>

<body>
<script>document.write(x)</script>
<script>document.write(pfm(x))</script>
<script>document.write(read_pfm(pfm(x)))</script>
</body>

</html>
